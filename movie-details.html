<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
    }
    .movie-container {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.1);
    }
    .movie-poster {
      border-radius: 12px;
      max-width: 300px;
      width: 100%;
    }
    .info-title {
      color: #ff4444;
      border-bottom: 2px solid #ff4444;
      display: inline-block;
      margin-bottom: 10px;
      padding-bottom: 5px;
    }
    .movie-meta p {
      margin: 6px 0;
      font-size: 1.05rem;
    }
    .cast-list span {
      background: #222;
      border-radius: 20px;
      padding: 6px 14px;
      margin: 4px;
      display: inline-block;
      font-size: 0.95rem;
    }
    .backdrop {
      background-size: cover;
      background-position: center;
      filter: blur(8px) brightness(0.4);
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
    .content-overlay {
      position: relative;
      z-index: 2;
    }
  </style>
</head>

<body>
  <div class="backdrop" id="backdrop"></div>

  <div class="container py-5 content-overlay">
    <button class="btn btn-outline-light mb-4" onclick="window.history.back()">← Back</button>

    <div id="movie-details" class="movie-container d-flex flex-column flex-md-row gap-4 align-items-start"></div>
  </div>


  <script src="js/detail.js"></script>
</body>
</html>
