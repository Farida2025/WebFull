<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyFlex - Home</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="text-white d-flex flex-column min-vh-100 bg-theme-4">

    <button id="theme-toggle" aria-label="Toggle theme">🌙</button>
    
    <header class="py-3 border-bottom border-secondary" id="header">
        <div class="container-fluid d-flex justify-content-between align-items-center px-4 px-lg-5">
            <div class="photo">
                <a href="index.html">
                    <img src="images/logo.jpg" data-light="images/whitelogo.jpg" alt="MyFlex Logo" class="logo" style="width: 100px; height: auto;" />
                </a>
            </div>
            <nav class="navbar navbar-expand-lg navbar-dark p-0" aria-label="Main Navigation">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav gap-2 gap-lg-4 align-items-center">
                        <li class="nav-item"><a class="nav-link active text-danger" aria-current="page" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="movies.html">Movies</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="series.html">Series</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="cartoons.html">Cartoons</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="news.html">News</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="contact.html">Contact</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="favorites.html">Favorites</a></li>
                        <li class="nav-item">
                            <button class="btn btn-danger nav-button mt-2 mt-lg-0 px-3" id="openAccessModal">Sign Up</button>
                        </li>
                    </ul>
                </div>
            </nav>
        </div>
    </header>

    <main class="flex-grow-1">
        <div class="hero-banner mb-5" style="background-image: url('images/index-image.jpg');">
            <h1 class="text-always-white display-3 fw-bold p-3 rounded text-center">Welcome to MyFlex</h1>
        </div>

        <div class="container-fluid px-4 px-lg-5">
            <!-- Your existing content sections here -->
        </div>
    </main>

    <!-- Auth Modal -->
    <div id="accessModal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h3 id="modalAccessTitle">Register for MyFlix</h3>

            <div class="form-wrapper" id="registerPanel">
                <form id="registrationForm">
                    <div class="form-group">
                        <label for="regName">Name:</label>
                        <input type="text" id="regName" name="name" class="form-control" />
                        <div class="error-message" id="regNameError"></div>
                    </div>
                    <div class="form-group">
                        <label for="regEmail">Email:</label>
                        <input type="email" id="regEmail" name="email" class="form-control" />
                        <div class="error-message" id="regEmailError"></div>
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Password (Min 8 chars):</label>
                        <input type="password" id="regPassword" name="password" class="form-control" />
                        <div class="error-message" id="regPasswordError"></div>
                    </div>
                    <div class="form-group">
                        <label for="regConfirmPassword">Confirm Password:</label>
                        <input type="password" id="regConfirmPassword" name="confirmPassword" class="form-control" />
                        <div class="error-message" id="regConfirmPasswordError"></div>
                    </div>
                    <button type="submit" class="btn btn-danger w-100 mt-3">Register</button>
                    <div class="success-message mt-2" id="regSuccessMessage"></div>
                </form>
                <p class="switch-link mt-3 text-center">
                    Already have an account? <a href="#" id="showLogin" class="text-danger">Log In</a>
                </p>
            </div>

            <div class="form-wrapper" id="loginPanel" style="display: none;">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="logEmail">Email:</label>
                        <input type="email" id="logEmail" name="email" class="form-control" />
                        <div class="error-message" id="logEmailError"></div>
                    </div>
                    <div class="form-group">
                        <label for="logPassword">Password:</label>
                        <input type="password" id="logPassword" name="password" class="form-control" />
                        <div class="error-message" id="logPasswordError"></div>
                    </div>
                    <button type="submit" class="btn btn-danger w-100 mt-3">Log In</button>
                    <div class="success-message mt-2" id="logSuccessMessage"></div>
                </form>
                <p class="switch-link mt-3 text-center">
                    Don't have an account? <a href="#" id="showRegister" class="text-danger">Register</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Profile Modal -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <span class="close-button" id="closeProfileModal">&times;</span>
            <h3>User Profile</h3>
            <div id="userProfileInfo">
                <p><strong>Name:</strong> <span id="profileName"></span></p>
                <p><strong>Email:</strong> <span id="profileEmail"></span></p>
                <p><strong>Member Since:</strong> <span id="profileMemberSince"></span></p>
            </div>
            <button class="btn btn-warning w-100 mt-3" id="logoutBtn">Log Out</button>
        </div>
    </div>

    <footer class="text-light mt-auto pt-5 pb-3 border-top border-secondary">
        <!-- Your existing footer content -->
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
    // Authentication functionality
    document.addEventListener('DOMContentLoaded', function() {
        // Elements
        const authModal = document.getElementById('accessModal');
        const profileModal = document.getElementById('profileModal');
        const openButton = document.getElementById('openAccessModal');
        const closeButtons = document.querySelectorAll('.close-button');
        const registerPanel = document.getElementById('registerPanel');
        const loginPanel = document.getElementById('loginPanel');
        const showLoginLink = document.getElementById('showLogin');
        const showRegisterLink = document.getElementById('showRegister');
        const modalTitle = document.getElementById('modalAccessTitle');
        const logoutBtn = document.getElementById('logoutBtn');
        const regForm = document.getElementById('registrationForm');
        const loginForm = document.getElementById('loginForm');

        // Check auth status on load
        checkAuthStatus();

        // Open modal based on auth status
        openButton.addEventListener('click', function() {
            if (isUserLoggedIn()) {
                showProfileModal();
            } else {
                openAuthModal();
            }
        });

        // Close modals
        closeButtons.forEach(button => {
            button.addEventListener('click', function() {
                closeAllModals();
            });
        });

        // Switch between login/register
        showLoginLink.addEventListener('click', function(e) {
            e.preventDefault();
            switchToLogin();
        });

        showRegisterLink.addEventListener('click', function(e) {
            e.preventDefault();
            switchToRegister();
        });

        // Logout
        logoutBtn.addEventListener('click', function() {
            logoutUser();
        });

        // Register form
        regForm.addEventListener('submit', function(e) {
            e.preventDefault();
            handleRegistration();
        });

        // Login form
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            handleLogin();
        });

        // Close modal when clicking outside
        window.addEventListener('click', function(e) {
            if (e.target === authModal) closeAllModals();
            if (e.target === profileModal) closeAllModals();
        });

        // Functions
        function openAuthModal() {
            authModal.style.display = 'flex';
            switchToRegister();
        }

        function showProfileModal() {
            const user = getCurrentUser();
            if (user) {
                document.getElementById('profileName').textContent = user.name;
                document.getElementById('profileEmail').textContent = user.email;
                document.getElementById('profileMemberSince').textContent = new Date(user.createdAt).toLocaleDateString();
                profileModal.style.display = 'flex';
            }
        }

        function closeAllModals() {
            authModal.style.display = 'none';
            profileModal.style.display = 'none';
        }

        function switchToLogin() {
            registerPanel.style.display = 'none';
            loginPanel.style.display = 'block';
            modalTitle.textContent = 'Welcome Back!';
            clearMessages();
        }

        function switchToRegister() {
            loginPanel.style.display = 'none';
            registerPanel.style.display = 'block';
            modalTitle.textContent = 'Register for MyFlix';
            clearMessages();
        }

        function handleRegistration() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;

            clearMessages();

            // Validation
            if (!name) {
                showError('regNameError', 'Name is required');
                return;
            }
            if (!email || !isValidEmail(email)) {
                showError('regEmailError', 'Valid email is required');
                return;
            }
            if (password.length < 8) {
                showError('regPasswordError', 'Password must be at least 8 characters');
                return;
            }
            if (password !== confirmPassword) {
                showError('regConfirmPasswordError', 'Passwords do not match');
                return;
            }

            // Create user
            const result = createUser(name, email, password);
            if (result.success) {
                showSuccess('regSuccessMessage', 'Registration successful! Please log in.');
                regForm.reset();
                setTimeout(() => switchToLogin(), 1500);
            } else {
                showError('regEmailError', result.message);
            }
        }

        function handleLogin() {
            const email = document.getElementById('logEmail').value.trim();
            const password = document.getElementById('logPassword').value;

            clearMessages();

            if (!email || !isValidEmail(email)) {
                showError('logEmailError', 'Valid email is required');
                return;
            }
            if (!password) {
                showError('logPasswordError', 'Password is required');
                return;
            }

            const result = authenticateUser(email, password);
            if (result.success) {
                setCurrentUser(result.user);
                showSuccess('logSuccessMessage', 'Login successful!');
                setTimeout(() => {
                    closeAllModals();
                    checkAuthStatus();
                }, 1000);
            } else {
                showError('logPasswordError', result.message);
            }
        }

        // Storage functions
        function getUsers() {
            return JSON.parse(localStorage.getItem('users')) || [];
        }

        function saveUsers(users) {
            localStorage.setItem('users', JSON.stringify(users));
        }

        function getUserByEmail(email) {
            const users = getUsers();
            return users.find(user => user.email === email);
        }

        function createUser(name, email, password) {
            const users = getUsers();
            
            if (getUserByEmail(email)) {
                return { success: false, message: 'User already exists' };
            }
            
            const newUser = {
                id: Date.now().toString(),
                name: name,
                email: email,
                password: password,
                createdAt: new Date().toISOString()
            };
            
            users.push(newUser);
            saveUsers(users);
            return { success: true, user: newUser };
        }

        function authenticateUser(email, password) {
            const user = getUserByEmail(email);
            if (!user) {
                return { success: false, message: 'User not found' };
            }
            if (user.password !== password) {
                return { success: false, message: 'Invalid password' };
            }
            return { success: true, user: user };
        }

        function setCurrentUser(user) {
            localStorage.setItem('currentUser', JSON.stringify(user));
        }

        function getCurrentUser() {
            return JSON.parse(localStorage.getItem('currentUser'));
        }

        function logoutUser() {
            localStorage.removeItem('currentUser');
            closeAllModals();
            checkAuthStatus();
        }

        function isUserLoggedIn() {
            return getCurrentUser() !== null;
        }

        function checkAuthStatus() {
            if (isUserLoggedIn()) {
                openButton.textContent = 'Profile';
                openButton.classList.remove('btn-danger');
                openButton.classList.add('btn-success');
            } else {
                openButton.textContent = 'Sign Up';
                openButton.classList.remove('btn-success');
                openButton.classList.add('btn-danger');
            }
        }

        // Helper functions
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            if (element) {
                element.textContent = message;
                element.style.display = 'block';
            }
        }

        function showSuccess(elementId, message) {
            const element = document.getElementById(elementId);
            if (element) {
                element.textContent = message;
                element.style.display = 'block';
            }
        }

        function clearMessages() {
            document.querySelectorAll('.error-message, .success-message').forEach(el => {
                el.textContent = '';
                el.style.display = 'none';
            });
        }
    });
    </script>

    <!-- Your other script files -->
    <script src="arrow.js" defer></script>
    <script src="accordion.js"></script>
    <script src="theme-switcher.js"></script>
    <script src="navKeyboard.js"></script>
    <script src="indexclick.js"></script>
</body>
</html>
